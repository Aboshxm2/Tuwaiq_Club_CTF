# frpc: first-start seed only. whale reads this [common] section once, stores
# it as "Frpc config template", and from then on writes the whole file itself
# (this section plus one route per running team instance).
[common]
server_addr = frps
server_port = 7000
# Only reachable from the frp-admin network (CTFd). Must match frpc's
# ipv4_address in docker-compose.production.yml.
admin_addr = 172.30.254.10
admin_port = 7400
