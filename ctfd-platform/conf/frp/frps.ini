# frps: receives each team's tunnel from frpc and serves it.
# CHALLENGE_DOMAIN comes from .env (see docker-compose.production.yml).
[common]
# frpc connects here over the internal frp-tunnel network. Not published.
bind_port = 7000
# Caddy forwards http://<instance>.CHALLENGE_DOMAIN/ here. Not published.
vhost_http_port = 8080
subdomain_host = {{ .Envs.CHALLENGE_DOMAIN }}
# Ports whale may hand out to "direct" (TCP) challenges. Keep in sync with the
# published range in docker-compose.production.yml and whale's Direct
# Minimum/Maximum Port settings.
allow_ports = 10000-10099
